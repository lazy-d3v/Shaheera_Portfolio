services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shaheera-portfolio
    # Published host port (${HOST_PORT}) — set in Dokploy → Environment so compose interpolation sees it (Preview Compose must show e.g. "9999:3000").
    # Dokploy normally serves the app via Traefik (Domains tab → http/https on :80 / :443), not http://SERVER_IP:HOST_PORT — use a domain for that path.
    # If you need IP:HOST_PORT from the internet: allow TCP HOST_PORT in the server firewall (ufw, etc.) and cloud security group; on the server run `curl -sI http://127.0.0.1:9999` (replace 9999) — if that works but the public IP does not, it is firewall/routing.
    ports:
      - "${HOST_PORT:-3001}:3000"
    environment:
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NODE_ENV=production
      # Nitro listen address/port inside the container (must match ports: …:3000)
      # Without NITRO_HOST, Node often logs [::]:3000 (IPv6 all interfaces) — still valid; 0.0.0.0 is explicit IPv4.
      - NITRO_HOST=0.0.0.0
      - PORT=3000
      # Keep V8 heap below the container memory limit (see deploy.resources.limits)
      - NODE_OPTIONS=--max-old-space-size=256
    env_file:
      - .env
    restart: unless-stopped
    # Small portfolio: cap CPU/RAM so the host is not starved (Compose v2+)
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 384M
        reservations:
          cpus: "0.05"
          memory: 64M
    healthcheck:
      # Node image often has no wget/curl; use Node's http (reads PORT from env, same as Nitro).
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:'+(process.env.PORT|| process.env.HOST_PORT ||3000)+'/',(r)=>{r.resume();process.exit(r.statusCode>=200&&r.statusCode<500?0:1)}).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
